name: neuflorest

services:
  db:
    image: postgres:15-alpine
    container_name: neuflorest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuflorest}
      POSTGRES_USER: ${POSTGRES_USER:-neuflorest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuflorest_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuflorest} -d ${POSTGRES_DB:-neuflorest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: neuflorest-backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:2020"
    volumes:
      - ./backend:/app
    ports:
      - "2020:2020"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3030,http://127.0.0.1:3030}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3030,http://127.0.0.1:3030}
      POSTGRES_DB: ${POSTGRES_DB:-neuflorest}
      POSTGRES_USER: ${POSTGRES_USER:-neuflorest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuflorest_dev_password}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: neuflorest-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3030:3030"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_BACKEND_PROXY_TARGET: ${VITE_BACKEND_PROXY_TARGET:-http://backend:2020}
    depends_on:
      - backend

volumes:
  postgres_data:
